# Builds the installers on GitHub's runners and attaches them to a release.
#
# Runs only when a version tag is pushed (v0.2.0, v1.0.0, …), never on
# ordinary commits, so a public repository pays nothing for it. See
# "Releasing" in the README for the steps that lead up to the tag.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Caches the compiled Rust dependencies between runs; the first build on
      # a platform is the slow one.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "StoryKeep ${{ github.ref_name }}"
          releaseBody: |
            Windows: download the `-setup.exe` and run it. Windows will say
            "Windows protected your PC" the first time because the installer
            is not code-signed; click **More info**, then **Run anyway**.

            Linux: the `.AppImage`, `.deb` or `.rpm`, whichever your
            distribution prefers.
          releaseDraft: false
          prerelease: false
