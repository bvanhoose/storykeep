<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B302D"/>
      <stop offset="1" stop-color="#0E1B1A"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5C184"/>
      <stop offset="1" stop-color="#B4873F"/>
    </linearGradient>
  </defs>

  <!-- book cloth -->
  <rect x="0" y="0" width="1024" height="1024" rx="216" fill="url(#cloth)"/>

  <!-- the spine: a raised band down the left edge -->
  <rect x="188" y="150" width="30" height="724" rx="15" fill="#25403B"/>

  <!-- page block -->
  <rect x="262" y="150" width="574" height="724" rx="26" fill="#E8E4D6"/>
  <rect x="262" y="150" width="574" height="724" rx="26" fill="none" stroke="#0E1B1A" stroke-opacity="0.18" stroke-width="10"/>

  <!-- ruled lines, thinning toward the foot -->
  <g fill="#0E1B1A" opacity="0.16">
    <rect x="346" y="336" width="406" height="20" rx="10"/>
    <rect x="346" y="418" width="406" height="20" rx="10"/>
    <rect x="346" y="500" width="316" height="20" rx="10"/>
    <rect x="346" y="582" width="406" height="20" rx="10"/>
    <rect x="346" y="664" width="220" height="20" rx="10"/>
  </g>

  <!-- the brass ribbon, the app's signature mark -->
  <path d="M604 118 h132 v418 l-66 -74 -66 74 Z" fill="url(#brass)"/>
</svg>
